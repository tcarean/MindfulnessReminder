name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CI: "true"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: verify
        shell: pwsh
        run: ./scripts/verify.ps1
